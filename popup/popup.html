<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ライフログ</title>
  <link rel="stylesheet" href="popup.css">
  <script src="../assets/chart.js"></script>
</head>
<body>
  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <h1 class="title">ライフログ</h1>
      <div class="stats-summary">
        <span class="stat-item">
          <span class="stat-number" id="todayCount">0</span>
          <span class="stat-label">今日</span>
        </span>
        <span class="stat-item">
          <span class="stat-number" id="totalCount">0</span>
          <span class="stat-label">総数</span>
        </span>
      </div>
    </header>

    <!-- 検索・フィルター -->
    <div class="search-section">
      <input type="text" id="searchInput" placeholder="検索..." class="search-input">
      <select id="filterSelect" class="filter-select">
        <option value="all">すべて</option>
        <option value="today">今日</option>
        <option value="week">今週</option>
        <option value="month">今月</option>
      </select>
    </div>

    <!-- 最近の履歴 -->
    <section class="recent-history">
      <h2 class="section-title">最近の履歴</h2>
      <div id="historyList" class="history-list">
        <!-- 履歴アイテムがここに動的に追加される -->
      </div>
    </section>

    <!-- 統計情報 -->
    <section class="stats-section">
      <h2 class="section-title">統計</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="uniqueDomains">0</div>
          <div class="stat-label">ユニークドメイン</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="topDomain">-</div>
          <div class="stat-label">最も訪問</div>
        </div>
      </div>
      
      <!-- グラフ表示エリア -->
      <div class="charts-section">
        <div class="chart-container">
          <h3 class="chart-title">時間帯別アクセス</h3>
          <canvas id="hourlyChart" width="300" height="120"></canvas>
        </div>
        <div class="chart-container">
          <h3 class="chart-title">上位ドメイン</h3>
          <canvas id="domainChart" width="300" height="120"></canvas>
        </div>
      </div>
    </section>

    <!-- フッター -->
    <footer class="footer">
      <button id="syncHistory" class="btn btn-secondary">履歴同期</button>
      <button id="openOptions" class="btn btn-secondary">設定</button>
      <button id="exportData" class="btn btn-primary">エクスポート</button>
    </footer>
  </div>

  <!-- 履歴アイテムのテンプレート -->
  <template id="historyItemTemplate">
    <div class="history-item">
      <div class="history-content">
        <div class="history-title"></div>
        <div class="history-domain"></div>
        <div class="history-time"></div>
      </div>
      <div class="history-actions">
        <button class="btn-icon btn-edit" title="メモを編集">
          <span>✏️</span>
        </button>
        <button class="btn-icon btn-delete" title="削除">
          <span>🗑️</span>
        </button>
      </div>
    </div>
  </template>

  <!-- メモ編集モーダル -->
  <div id="noteModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>メモを編集</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="noteTextarea" placeholder="メモを入力してください..."></textarea>
      </div>
      <div class="modal-footer">
        <button id="saveNote" class="btn btn-primary">保存</button>
        <button id="cancelNote" class="btn btn-secondary">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
